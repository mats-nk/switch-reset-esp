; Switch Reset for ESP32 / ESP8266 - web GUI + terminal for factory-resetting switches over a serial console.
; Build all boards into the project root:  ./build.sh
; Build/upload (no install needed, uses uv):
;   uv tool run platformio run -e esp32dev -t upload
;   uv tool run platformio run -e esp8266-d1mini -t upload

[platformio]
default_envs = esp32dev

[common]
monitor_speed = 115200
lib_deps =
    tzapu/WiFiManager@^2.0.17
    links2004/WebSockets@^2.6.1

; ================= ESP32 family =================
; NOTE: USB-CDC-on-boot is deliberately NOT enabled (it breaks the build on some core versions:
; WiFiManager needs the global `Serial`). Debug text therefore goes to UART0 (not to USB); flashing over USB works as usual.
; To get logs over USB on C3/S3, add:  -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1  to that env's build_flags.
[esp32base]
platform = espressif32@^6.9.0
framework = arduino
upload_speed = 921600
monitor_speed = ${common.monitor_speed}
lib_deps = ${common.lib_deps}
build_flags =
    -DCORE_DEBUG_LEVEL=0

; Classic ESP32 DevKit: console UART on GPIO16 (RX) / GPIO17 (TX)
[env:esp32dev]
extends = esp32base
board = esp32dev
build_flags =
    ${esp32base.build_flags}
    -DCONSOLE_RX_PIN=16
    -DCONSOLE_TX_PIN=17

; ESP32-S3 DevKitC-1: GPIO18 (RX) / GPIO17 (TX)
[env:esp32-s3]
extends = esp32base
board = esp32-s3-devkitc-1
build_flags =
    ${esp32base.build_flags}
    -DCONSOLE_RX_PIN=18
    -DCONSOLE_TX_PIN=17

; ESP32-C3 (Super Mini etc.): GPIO4 (RX) / GPIO5 (TX), BOOT button = GPIO9
[env:esp32-c3]
extends = esp32base
board = esp32-c3-devkitm-1
build_flags =
    ${esp32base.build_flags}
    -DCONSOLE_RX_PIN=4
    -DCONSOLE_TX_PIN=5
    -DBOOT_BUTTON_PIN=9

; Wemos / LOLIN S2 mini (ESP32-S2, native USB): GPIO18 (RX) / GPIO17 (TX), BUTTON 0 = GPIO0
; First flash: hold button 0, press RST, release 0 (bootloader mode), then upload.
[env:esp32-s2-mini]
extends = esp32base
board = lolin_s2_mini
build_flags =
    ${esp32base.build_flags}
    -DCONSOLE_RX_PIN=18
    -DCONSOLE_TX_PIN=17

; ================= ESP8266 family =================
; Console UART is UART0 swapped to GPIO13 (RX, D7) / GPIO15 (TX, D8). Debug output: GPIO2 (TX only).
[esp8266base]
platform = espressif8266@^4.2.1
framework = arduino
board_build.f_cpu = 160000000L
upload_speed = 460800
monitor_speed = ${common.monitor_speed}
lib_deps = ${common.lib_deps}

; Wemos D1 mini: RX = D7 (GPIO13), TX = D8 (GPIO15), FLASH button = GPIO0 (D3)
[env:esp8266-d1mini]
extends = esp8266base
board = d1_mini

; ESP-01 / ESP-01S (1 MB flash): only UART0 on GPIO3 (RX) / GPIO1 (TX) is available, no swap.
; No button (GPIO0 low at power-up = flash mode), so the "hold BOOT" factory reset does not exist.
; If the sketch ever gets too big for OTA, use eagle.flash.1m0.ld (no OTA, no file system).
[env:esp8266-esp01]
extends = esp8266base
board = esp01_1m
upload_speed = 115200
board_build.ldscript = eagle.flash.1m64.ld
build_flags =
    -DCONSOLE_RX_PIN=3
    -DCONSOLE_TX_PIN=1
    -DCONSOLE_NO_SWAP
    -DBOOT_BUTTON_PIN=-1

; NodeMCU v2 / v3 (ESP-12E / ESP-12F, 4 MB): RX = D7 (GPIO13), TX = D8 (GPIO15), FLASH button = GPIO0 (D3)
[env:esp8266-nodemcu]
extends = esp8266base
board = nodemcuv2
build_flags =
    -DCONSOLE_RX_PIN=13
    -DCONSOLE_TX_PIN=15
